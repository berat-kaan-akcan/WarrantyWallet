# Local stack: PostgreSQL + Warranty Wallet API.
#   cp .env.example .env   # fill GEMINI_API_KEY (optional) and JWT_SECRET
#   docker compose up --build
# Optional MinIO object storage (set the S3_* values from .env.example, then):
#   docker compose --profile s3 up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warranty
      POSTGRES_PASSWORD: warranty
      POSTGRES_DB: warranty
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warranty"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://warranty:warranty@db:5432/warranty?sslmode=disable
      STORAGE_DIR: /data/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
    ports: ["8080:8080"]
    volumes: [uploads:/data/uploads]
    depends_on:
      db:
        condition: service_healthy

  minio:
    profiles: ["s3"]
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-warranty}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-warranty-dev-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    profiles: ["s3"]
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do sleep 1; done;
      mc mb --ignore-existing local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-warranty}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-warranty-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-warranty}

volumes:
  pgdata:
  uploads:
  miniodata:
