name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (vet, fmt, unit + handler tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test (no external services, no Gemini key)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  backend-postgres:
    name: Backend (PostgreSQL integration)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warranty
          POSTGRES_PASSWORD: warranty
          POSTGRES_DB: warranty_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warranty" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://warranty:warranty@localhost:5432/warranty_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go.mod / go.sum are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Build and vet with driver
        run: go build -tags pgx ./... && go vet -tags pgx ./...
      - name: Store contract tests against PostgreSQL
        run: go test -tags pgx -count=1 -v ./internal/store/postgres/

  docker:
    name: Docker image build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t warranty-wallet-api:ci ./backend

  mobile:
    name: Mobile (format, analyze, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  mobile-android:
    name: Mobile (Android debug APK)
    runs-on: ubuntu-24.04
    needs: mobile
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
